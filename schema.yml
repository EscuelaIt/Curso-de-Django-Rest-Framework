  /api/transactions/{id}/:
    delete:
      operationId: transactions_destroy
      description: ViewSet for managing banking transactions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Transacción.
        required: true
      tags:
