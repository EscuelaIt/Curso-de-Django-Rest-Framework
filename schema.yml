  /api/transactions/:
    get:
      operationId: transactions_list
      description: Retrieve a paginated list of all transactions.
      summary: List all transactions
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          enum:
          - EUR
          - PEN
          - USD
        description: |-
          Transaction currency

          * `PEN` - Soles Peruanos
          * `USD` - Dólares Americanos
          * `EUR` - Euros
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: source_account
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - PENDING
          - PROCESSED
          - REJECTED
          - REVERSED
        description: |-
          Transaction status

          * `PENDING` - Pendiente
          * `PROCESSED` - Procesada
          * `REJECTED` - Rechazada
          * `REVERSED` - Reversada
      - in: query
        name: transaction_type
        schema:
          type: string
          enum:
          - DEPOSIT
          - TRANSFER_IN
          - TRANSFER_OUT
          - WITHDRAWAL
        description: |-
          Type of transaction

          * `DEPOSIT` - Depósito
          * `WITHDRAWAL` - Retiro
          * `TRANSFER_OUT` - Transferencia Salida
          * `TRANSFER_IN` - Transferencia Entrada
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - Transactions
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionListList'
          description: ''
    post:
      operationId: transactions_create
      description: Create a new transaction in the banking system.
      summary: Create a new transaction
      tags:
      - Transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionCreate'
          description: ''
  /api/transactions/deposit/:
    post:
      operationId: transactions_deposit_create
      description: Create a deposit transaction to an account.
      summary: Make a deposit
      tags:
      - Transactions
      requestBody:
        content:
          application/json:
            schema:
