          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomerUpdateRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerUpdate'
          description: ''
    put:
      operationId: customers_update
      description: Update customer information.
      summary: Update customer information
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Cliente.
        required: true
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
          multipart/form-data:
