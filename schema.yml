      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsAccountUpdate'
          description: ''
    get:
      operationId: accounts_retrieve
      description: Retrieve detailed information about a specific account.
      summary: Get account details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Cuenta de Ahorro.
