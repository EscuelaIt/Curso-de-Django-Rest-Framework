          type: integer
          readOnly: true
          description: Version for change control
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Registration date in the system
        full_name:
          type: string
          readOnly: true
          description: Customer's full name
        age:
          type: integer
          readOnly: true
          description: Customer's current age
        full_document:
          type: string
          readOnly: true
          description: Document type and number
        accounts_count:
          type: integer
          description: Number of savings accounts
          readOnly: true
