            schema:
              $ref: '#/components/schemas/SavingsAccountUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavingsAccountUpdateRequest'
          multipart/form-data:
            schema:
