          type: string
          format: email
          pattern: .*@escuela\.it$
          description: Customer's unique email (must be @escuela.it domain)
          maxLength: 254
        phone:
          type: string
          description: Contact phone number
          pattern: ^\+?[0-9\-\s]+$
          maxLength: 20
        birth_date:
          type: string
          format: date
          description: Date of birth
        address:
          type: string
          description: Complete address
        status:
          allOf:
          - $ref: '#/components/schemas/Status3daEnum'
