          description: ''
    put:
      operationId: accounts_update
      description: Update account information.
      summary: Update account information
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Cuenta de Ahorro.
        required: true
      tags:
      - Accounts
      requestBody:
        content:
