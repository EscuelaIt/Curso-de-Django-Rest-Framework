      - USD
      - EUR
      type: string
      description: |-
        * `PEN` - Soles Peruanos
        * `USD` - Dólares Americanos
        * `EUR` - Euros
    Customer:
      type: object
      description: |-
        Complete serializer for Customer model.
        Includes computed fields and validation for banking requirements.
      properties:
        id:
          type: integer
          readOnly: true
        document_type:
          allOf:
          - $ref: '#/components/schemas/DocumentTypeEnum'
          description: |-
            Type of identity document

            * `DNI` - Documento Nacional de Identidad
            * `CE` - Carnet de Extranjería
            * `PASSPORT` - Pasaporte
        document_number:
          type: string
          description: Document number without spaces or hyphens
          pattern: ^[A-Z0-9]+$
