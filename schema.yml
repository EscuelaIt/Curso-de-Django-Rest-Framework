    AuditSummary:
      type: object
      description: |-
        Serializer for audit statistics and summaries.
        Contract-first for dashboard and reporting endpoints.
      properties:
        total_operations:
          type: integer
          readOnly: true
          description: Total number of operations
        operations_by_type:
          type: object
          additionalProperties: {}
          readOnly: true
          description: Count of operations by type
