components:
  schemas:
    AuditDetail:
      type: object
      description: |-
        Detailed serializer for individual audit records.
        Includes complete change information and metadata.
      properties:
        id:
          type: integer
          readOnly: true
        affected_table:
          type: string
          description: Name of the affected database table
          maxLength: 50
        record_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: ID of the affected record
        operation:
          allOf:
          - $ref: '#/components/schemas/OperationEnum'
          description: |-
            Type of database operation performed

            * `INSERT` - Inserción
            * `UPDATE` - Actualización
            * `DELETE` - Eliminación
        operation_display:
          type: string
          readOnly: true
        previous_data:
          nullable: true
          description: Previous data before the operation (JSON format)
        new_data:
          nullable: true
          description: New data after the operation (JSON format)
        user:
          type: integer
          description: User who performed the operation
        user_name:
          type: string
          readOnly: true
        user_full_name:
          type: string
          readOnly: true
        user_email:
          type: string
          readOnly: true
        operation_date:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the operation was performed
        ip_address:
          type: string
          description: IP address from which the operation was performed
        user_agent:
          type: string
          description: User agent information from the request
          maxLength: 500
        context:
          type: string
          description: Additional context about the operation (e.g., 'admin_panel',
            'api_rest')
          maxLength: 100
        has_data_changes:
          type: boolean
          readOnly: true
        changed_fields:
          type: array
          items: {}
          readOnly: true
        changes_summary:
          type: string
          readOnly: true
        field_changes:
          type: object
          additionalProperties: {}
          description: Detailed field-by-field changes
          readOnly: true
      required:
      - affected_table
      - changed_fields
      - changes_summary
      - field_changes
      - has_data_changes
      - id
      - ip_address
      - operation
      - operation_date
      - operation_display
      - record_id
      - user
      - user_email
      - user_full_name
      - user_name
    AuditList:
      type: object
      description: |-
        Simplified serializer for audit listings.
        Optimized for list views with essential information.
      properties:
        id:
          type: integer
          readOnly: true
        affected_table:
          type: string
          description: Name of the affected database table
          maxLength: 50
        record_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: ID of the affected record
        operation:
          allOf:
          - $ref: '#/components/schemas/OperationEnum'
          description: |-
            Type of database operation performed

            * `INSERT` - Inserción
            * `UPDATE` - Actualización
            * `DELETE` - Eliminación
        operation_display:
          type: string
          readOnly: true
        user_name:
          type: string
          readOnly: true
        operation_date:
          type: string
          format: date-time
          readOnly: true
          description: Date and time when the operation was performed
        context:
          type: string
          description: Additional context about the operation (e.g., 'admin_panel',
