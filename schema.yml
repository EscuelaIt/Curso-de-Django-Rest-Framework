      operationId: transactions_withdrawal_create
      description: Create a withdrawal transaction from an account.
      summary: Make a withdrawal
      tags:
      - Transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
          multipart/form-data:
