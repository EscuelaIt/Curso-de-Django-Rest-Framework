openapi: 3.0.3
info:
  title: Banking System API
  version: 1.0.0
  description: API REST para sistema bancario con cuentas de ahorro, transacciones
    y auditoría
paths:
  /api/users/:
    get:
      operationId: users_list
      description: Retrieve a paginated list of all users in the banking system.
      summary: List all users
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - CUSTOMER
          - OPERATOR
        description: |-
          User role in the system

          * `CUSTOMER` - Cliente
          * `OPERATOR` - Operador
          * `ADMIN` - Administrador
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - Users
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserListList'
          description: ''
    post:
      operationId: users_create
      description: Create a new user in the banking system.
      summary: Create a new user
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreate'
          description: ''
  /api/users/change_password/:
    post:
      operationId: users_change_password_create
      description: Change password for the authenticated user.
      summary: Change user password
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: No response body
  /api/users/me/:
    get:
      operationId: users_me_retrieve
      description: Get profile information for the currently authenticated user.
      summary: Get current user profile
      tags:
      - Users
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/:
    delete:
      operationId: users_destroy
      description: Delete a user from the system.
      summary: Delete user
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Usuario.
        required: true
      tags:
      - Users
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
    patch:
      operationId: users_partial_update
      description: ViewSet for managing banking system users.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Usuario.
        required: true
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
    put:
      operationId: users_update
      description: Update user information.
      summary: Update user information
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Usuario.
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdate'
          description: ''
    get:
      operationId: users_retrieve
      description: Retrieve detailed information about a specific user.
      summary: Get user details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este Usuario.
        required: true
      tags:
      - Users
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/customers/:
    get:
      operationId: customers_list
      description: Retrieve a paginated list of all customers.
      summary: List all customers
      parameters:
      - in: query
        name: document_type
        schema:
          type: string
          enum:
          - CE
          - DNI
          - PASSPORT
        description: |-
          Type of identity document

          * `DNI` - Documento Nacional de Identidad
          * `CE` - Carnet de Extranjería
          * `PASSPORT` - Pasaporte
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
        description: |-
          Current customer status

          * `ACTIVE` - Activo
          * `INACTIVE` - Inactivo
          * `SUSPENDED` - Suspendido
      tags:
      - Customers
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerListList'
          description: ''
    post:
      operationId: customers_create
      description: Create a new customer in the banking system.
      summary: Create a new customer
      tags:
      - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCreate'
          description: ''
  /api/customers/{id}/:
    delete:
      operationId: customers_destroy
      description: Delete a customer from the system.
      summary: Delete customer
      parameters:
      - in: path
        name: id
        schema:
