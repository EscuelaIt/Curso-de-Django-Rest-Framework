          description: ''
  /api/accounts/:
    get:
      operationId: accounts_list
      description: Retrieve a paginated list of all savings accounts.
      summary: List all savings accounts
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          enum:
          - EUR
          - PEN
          - USD
        description: |-
          Account currency

          * `PEN` - Soles Peruanos
          * `USD` - Dólares Americanos
          * `EUR` - Euros
      - in: query
        name: customer
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
          - CLOSED
        description: |-
          Current account status

          * `ACTIVE` - Activa
          * `BLOCKED` - Bloqueada
          * `CLOSED` - Cerrada
      tags:
      - Accounts
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSavingsAccountListList'
          description: ''
    post:
      operationId: accounts_create
      description: Create a new savings account for a customer.
      summary: Create a new savings account
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsAccountCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavingsAccountCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavingsAccountCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsAccountCreate'
          description: ''
  /api/accounts/{id}/:
    delete:
      operationId: accounts_destroy
      description: Delete an account from the system.
      summary: Delete account
      parameters:
